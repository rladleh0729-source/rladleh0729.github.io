<form id="contactForm">
  <input type="text" id="name" placeholder="이름" required />
  <input type="email" id="email" placeholder="이메일" required />
  <input type="text" id="category" placeholder="분류" required />
  <input type="text" id="title" placeholder="제목" required />
  <textarea id="content" placeholder="내용" required></textarea>
  <button type="submit">보내기</button>
</form>

<div id="resultMessage"></div>

<script>
document.getElementById("contactForm").addEventListener("submit", async function (e) {
    e.preventDefault();

    const data = {
        name: document.getElementById("name").value.trim(),
        email: document.getElementById("email").value.trim(),
        category: document.getElementById("category").value.trim(),
        title: document.getElementById("title").value.trim(),
        content: document.getElementById("content").value.trim()
    };

    const resultBox = document.getElementById("resultMessage");
    resultBox.textContent = "전송 중...";

    try {
        const response = await fetch("https://chatchosim-backend-1.onrender.com/api/submit-data", {
    method: "POST",
    headers: {
        "Content-Type": "application/json"
    },
    body: JSON.stringify(data)
});

        const result = await response.json();

        if (response.ok) {
            resultBox.textContent = result.message || "전송이 완료되었습니다.";
            document.getElementById("contactForm").reset();
        } else {
            resultBox.textContent = result.detail || result.message || "전송에 실패했습니다.";
        }
    } catch (error) {
        resultBox.textContent = "서버 연결에 실패했습니다.";
        console.error(error);
    }
});
</script>
